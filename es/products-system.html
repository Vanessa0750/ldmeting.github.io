    function renderProducts(lang) {
        var grid = document.getElementById('productGrid');
        var products = productData[lang] || productData.zh;
        grid.innerHTML = '';

        products.forEach(function(product) {
            var card = document.createElement('div');
            card.className = 'product-card';

            var slider = document.createElement('div');
            slider.className = 'product-img-slider';
            slider.dataset.sliderId = product.id;

            var wrapper = document.createElement('div');
            wrapper.className = 'slider-wrapper';

            product.images.forEach(function(img) {
                var item = document.createElement('div');
                item.className = 'slider-item';
                item.style.backgroundImage = 'url(' + encodeURI(img) + ')';
                wrapper.appendChild(item);
            });

            slider.appendChild(wrapper);

            var prevBtn = document.createElement('button');
            prevBtn.className = 'slider-btn prev-btn';
            prevBtn.textContent = '‹';
            slider.appendChild(prevBtn);

            var nextBtn = document.createElement('button');
            nextBtn.className = 'slider-btn next-btn';
            nextBtn.textContent = '›';
            slider.appendChild(nextBtn);

            var indicators = document.createElement('div');
            indicators.className = 'slider-indicators';
            product.images.forEach(function(img, idx) {
                var dot = document.createElement('span');
                dot.className = 'indicator-dot' + (idx === 0 ? ' active' : '');
                dot.dataset.index = idx;
                indicators.appendChild(dot);
            });
            slider.appendChild(indicators);

            var info = document.createElement('div');
            info.className = 'product-info';

            var title = document.createElement('h3');
            title.textContent = product.name;

            var paramsDiv = document.createElement('div');
            paramsDiv.className = 'product-params';
            product.params.forEach(function(p) {
                var pTag = document.createElement('p');
                pTag.textContent = p;
                paramsDiv.appendChild(pTag);
            });

            var descP = document.createElement('p');
            descP.className = 'product-desc';
            descP.textContent = product.desc;

            info.appendChild(title);
            info.appendChild(paramsDiv);
            info.appendChild(descP);

            card.appendChild(slider);
            card.appendChild(info);
            grid.appendChild(card);

            initSlider(slider);
        });
    }

    function initSlider(slider) {
        var wrapper = slider.querySelector('.slider-wrapper');
        var items = slider.querySelectorAll('.slider-item');
        var prevBtn = slider.querySelector('.prev-btn');
        var nextBtn = slider.querySelector('.next-btn');
        var indicators = slider.querySelectorAll('.indicator-dot');
        var totalItems = items.length;
        var currentIndex = 0;

        if (totalItems <= 1) {
            if (prevBtn) prevBtn.style.display = 'none';
            if (nextBtn) nextBtn.style.display = 'none';
            return;
        }

        function updateSlider() {
            wrapper.style.transform = 'translateX(-' + (currentIndex * 100) + '%)';
            indicators.forEach(function(dot, idx) {
                dot.classList.toggle('active', idx === currentIndex);
            });
        }

        prevBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + totalItems) % totalItems;
            updateSlider();
        });

        nextBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % totalItems;
            updateSlider();
        });

        indicators.forEach(function(dot, idx) {
            dot.addEventListener('click', function(e) {
                e.stopPropagation();
                currentIndex = idx;
                updateSlider();
            });
        });
    }

    var currentLang = localStorage.getItem('ldmeting-lang') || 'zh';

    function switchLanguage(lang) {
        if (!navTranslations[lang]) return;
        currentLang = lang;

        document.querySelectorAll('[data-key]').forEach(function(el) {
            var key = el.getAttribute('data-key');
            if (navTranslations[lang] && navTranslations[lang][key]) {
                el.textContent = navTranslations[lang][key];
            }
        });

        document.querySelectorAll('.lang-switcher a').forEach(function(link) {
            link.classList.remove('active');
            if (link.getAttribute('data-lang') === lang) {
                link.classList.add('active');
            }
        });

        renderProducts(lang);
        localStorage.setItem('ldmeting-lang', lang);
    }

    function handleImageErrors() {
        document.querySelectorAll('.slider-item').forEach(function(img) {
            var imgUrl = img.style.backgroundImage.replace(/url\(["']?(.*?)["']?\)/, '$1');
            var testImg = new Image();
            testImg.src = imgUrl;
            testImg.onerror = function() {
                img.style.backgroundImage = 'none';
            };
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.lang-switcher a').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                switchLanguage(this.getAttribute('data-lang'));
            });
        });
        switchLanguage(currentLang);
        setTimeout(handleImageErrors, 500);
    });
</script>
