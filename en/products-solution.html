    };

    var navTranslations = {
        zh: { nav_home: "返回首页", nav_profile: "公司介绍", nav_products: "产品中心", nav_articles: "企业资讯", nav_contact: "联系方式", bread_home: "首页", bread_products: "产品中心", bread_current: "整体解决方案", page_title: "整体解决方案", footer_copyright: "© 2005 LDMETING 恩平市凌动电子科技有限公司 保留所有权利。" },
        en: { nav_home: "Home", nav_profile: "About Us", nav_products: "Products", nav_articles: "News", nav_contact: "Contact", bread_home: "Home", bread_products: "Products", bread_current: "Total Solutions", page_title: "Total Solutions", footer_copyright: "© 2005 LDMETING Enping Lingdong Electronic Technology Co., Ltd. All rights reserved." },
        es: { nav_home: "Inicio", nav_profile: "Sobre Nosotros", nav_products: "Productos", nav_articles: "Noticias", nav_contact: "Contacto", bread_home: "Inicio", bread_products: "Productos", bread_current: "Soluciones Integrales", page_title: "Soluciones Integrales", footer_copyright: "© 2005 LDMETING Enping Lingdong Electronic Technology Co., Ltd. Todos los derechos reservados." },
        ru: { nav_home: "Главная", nav_profile: "О нас", nav_products: "Продукты", nav_articles: "Новости", nav_contact: "Контакты", bread_home: "Главная", bread_products: "Продукты", bread_current: "Комплексные Решения", page_title: "Комплексные Решения", footer_copyright: "© 2005 LDMETING Enping Lingdong Electronic Technology Co., Ltd. Все права защищены." }
    };

    function renderSolutions(lang) {
        var grid = document.getElementById('solutionGrid');
        var solutions = solutionData[lang] || solutionData.zh;
        grid.innerHTML = '';

        solutions.forEach(function(solution) {
            var card = document.createElement('div');
            card.className = 'solution-card';

            var imgDiv = document.createElement('div');
            imgDiv.className = 'solution-img';
            imgDiv.style.backgroundImage = 'url(' + encodeURI(solution.img) + ')';

            var info = document.createElement('div');
            info.className = 'solution-info';

            var title = document.createElement('h3');
            title.textContent = solution.name;

            var paramsDiv = document.createElement('div');
            paramsDiv.className = 'solution-params';
            solution.params.forEach(function(p) {
                var pTag = document.createElement('p');
                pTag.textContent = p;
                paramsDiv.appendChild(pTag);
            });

            var descP = document.createElement('p');
            descP.className = 'solution-desc';
            descP.textContent = solution.desc;

            info.appendChild(title);
            info.appendChild(paramsDiv);
            info.appendChild(descP);

            card.appendChild(imgDiv);
            card.appendChild(info);
            grid.appendChild(card);
        });
    }

    function handleImageErrors() {
        document.querySelectorAll('.solution-img').forEach(function(img) {
            var imgUrl = img.style.backgroundImage.replace(/url\(["']?(.*?)["']?\)/, '$1');
            var testImg = new Image();
            testImg.src = imgUrl;
            testImg.onerror = function() {
                img.style.backgroundImage = 'none';
            };
        });
    }

    var currentLang = localStorage.getItem('ldmeting-lang') || 'zh';

    function switchLanguage(lang) {
        if (!navTranslations[lang]) return;
        currentLang = lang;

        document.querySelectorAll('[data-key]').forEach(function(el) {
            var key = el.getAttribute('data-key');
            if (navTranslations[lang] && navTranslations[lang][key]) {
                el.textContent = navTranslations[lang][key];
            }
        });

        document.querySelectorAll('.lang-switcher a').forEach(function(link) {
            link.classList.remove('active');
            if (link.getAttribute('data-lang') === lang) {
                link.classList.add('active');
            }
        });

        renderSolutions(lang);
        localStorage.setItem('ldmeting-lang', lang);
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.lang-switcher a').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                switchLanguage(this.getAttribute('data-lang'));
            });
        });
        switchLanguage(currentLang);
        setTimeout(handleImageErrors, 500);
    });
</script>
